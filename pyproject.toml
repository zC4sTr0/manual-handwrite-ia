[project]
name = "manual-handwrite-ia"
version = "0.1.0"
description = "Aprende a sua letra a partir de amostras escaneadas e gera manuscritos com aspecto de papel escaneado."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Fase 5: torch, diffusers
neural = []

[project.scripts]
handwrite = "manual_handwrite.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manual_handwrite"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
