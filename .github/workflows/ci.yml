# CI: gates canônicos em Linux e Windows. Sem segredos e sem dados pessoais;
# os testes usam apenas fixtures sintéticas geradas em tempo de teste.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --dev
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run ruff format --check .
